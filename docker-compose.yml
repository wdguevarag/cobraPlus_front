services:
  mysql:
    image: mysql:8.4
    container_name: mysql-local
    restart: unless-stopped
    ports:
      - "3306:3306"          # Cambia a "3307:3306" si ya tienes MySQL local
    environment:
      MYSQL_ROOT_PASSWORD: supersecret
      MYSQL_DATABASE: cobra_db
      MYSQL_USER: cobra_user
      MYSQL_PASSWORD: cobra_pass
      TZ: America/Lima
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --max_connections=300
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./mysql/conf.d:/etc/mysql/conf.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psupersecret"]
      interval: 10s
      timeout: 5s
      retries: 10
