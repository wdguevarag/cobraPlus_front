<div class="paginator-container d-flex align-items-center gap-2 mt-3">
  <button class="btn btn-outline-secondary btn-sm" (click)="goToPrevious()" [disabled]="currentPage <= 1">
    <i class="bi bi-chevron-left"></i>
  </button>

  <span class="mx-2">Página {{ currentPage }}</span>

  <button class="btn btn-outline-secondary btn-sm" (click)="goToNext()" [disabled]="currentPage >= totalPages">
    <i class="bi bi-chevron-right"></i>
  </button>

  <label class="ms-3 me-1">Tamaño:</label>
  <select
    class="form-select form-select-sm"
    [ngModel]="pageSize"
    (ngModelChange)="onPageSizeChange($event)"
    style="width: auto;"
  >
    <option [value]="10">10</option>
    <option [value]="15">15</option>
    <option [value]="20">20</option>
    <option [value]="50">50</option>
  </select>
</div>
