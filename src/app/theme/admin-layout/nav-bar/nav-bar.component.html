<header class="pc-header">
  <div class="header-wrapper d-flex align-items-center " style="gap: 10px;">
    <div class="pc-mob-drp ">
      <app-nav-left [navCollapsed]="navCollapsed" (NavCollapse)="navCollapse()" (NavCollapsedMob)="navCollapseMob()"></app-nav-left>
    </div>
    <div class="d-flex justify-content-between w-100 align-items-center"> 
      <div class="breadcrumb-container ">
        <app-breadcrumb></app-breadcrumb>
    </div>

    <div class="nav-right-container  d-flex flex-nowrap align-items-center" >
      <div class="time-text d-inline"><span>{{ currentTime }}</span></div>
      <app-nav-right></app-nav-right>
    </div>
    </div>
  </div>
</header>
<footer class="pc-footer">
    <app-btn-back></app-btn-back>
</footer>
