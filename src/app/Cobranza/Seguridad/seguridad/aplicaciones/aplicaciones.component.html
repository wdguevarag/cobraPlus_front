<div>
    <div class="section-container-title d-flex justify-content-between align-items-center">
      <h3 class="title">Lista de Aplicaciones</h3>
    </div> 
    <div class="section-container">
      <app-general-table 
      [columns]="aplicacionColumns" 
      [data]="aplicacionData"

    </div>
    
    <div class="d-flex justify-content-end mt-5">
      <app-general-plus-check-btn [tipo]="'plus'" [routerLink]="'./nueva-aplicacion'"></app-general-plus-check-btn>
    </div>
</div>
