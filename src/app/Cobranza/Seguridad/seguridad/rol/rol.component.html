<div *ngIf="currentUser">
  <div class="section-container-title d-flex justify-content-between align-items-center">
    <h3 class="title">Lista de Roles</h3>
  </div> 

  <div class="section-container">

    <div *ngIf="currentUser.Perfil_ID == '1'">
      <app-general-table 
        [columns]="rolColumnsSuperAdmin" 
        [data]="rolData" 
        (rowClick)="onRowClick($event)" 
        (buttonClick)="onButtonAction($event)">
      </app-general-table>
    </div>


    <div *ngIf="currentUser.Perfil_ID != '1'">
      <app-general-table 
        [columns]="rolColumnsAdminEmpresa" 
        [data]="rolData" 
        (rowClick)="onRowClick($event)" 
        (buttonClick)="onButtonAction($event)">
      </app-general-table>
    </div>

  </div>

  <div>
    <div class="d-flex justify-content-end mt-5">
      <app-general-plus-check-btn [tipo]="'plus'" [routerLink]="'./nuevo-rol'"></app-general-plus-check-btn>
    </div>
  </div>
</div>

<!-- Mensaje mientras carga el usuario -->
<div *ngIf="!currentUser">
  <p>Cargando usuario y roles...</p>
</div>
