<div>
  <div *ngIf="currentUser?.Perfil_ID == '1'">
    <div class="section-container-title d-flex justify-content-between align-items-center">
      <h3 class="title">Lista de Empresas</h3>
    </div>

    <div class="section-container">
      <app-general-table [columns]="empresaColumns" [data]="empresaData" (rowClick)="onRowClick($event)"></app-general-table>
    </div>

    <div class="d-flex justify-content-end mt-5">
      <app-general-plus-check-btn [tipo]="'plus'" [routerLink]="'./nueva-empresa'"></app-general-plus-check-btn>
    </div>
  </div>

  <div *ngIf="currentUser?.Perfil_ID !== '1'">
    <app-single-empresa [type]="'special'" [singleEmpresaIdInput]="currentUser.Empresa_ID"></app-single-empresa>
  </div>
</div>
