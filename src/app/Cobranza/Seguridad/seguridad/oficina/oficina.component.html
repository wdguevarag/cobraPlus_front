<div>
    <div class="section-container-title d-flex justify-content-between align-items-center">
      <h3 class="title">Lista de Oficinas </h3>
    </div>

    <div class="section-container">
      <app-general-table
      [columns]="oficinaColumns"
      [data]="oficinaData"
      (rowClick)="onRowClick($event)"
      (buttonClick)="onButtonAction($event)">
    </app-general-table>
    </div>

    <div class="d-flex justify-content-end mt-5">
      <app-general-plus-check-btn [tipo]="'plus'" [routerLink]="'./nueva-oficina'"></app-general-plus-check-btn>
    </div>
</div>
