<div class="section-container-title">
  <h3 class="title">Nueva Oficina</h3>
  <app-general-back-btn [tipo]="'cancel'"></app-general-back-btn>
</div>

<form [formGroup]="oficinaForm" class="form">
  <div class="section-container">
    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-control" formControlName="Nombre" onlyMayus>

      </div>
      <div class="col-md-6">
        <label class="form-label">Descripción</label>
        <input type="text" class="form-control" formControlName="Descripcion" onlyMayus>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-3">
        <label class="form-label">Ubicación</label>
        <app-general-input-ubicacion  formControlName="Ubicacion">
        </app-general-input-ubicacion>
      </div>
      <div class="col-md-3">
        <label class="form-label">Coordenada Y</label>
        <input type="number" class="form-control" formControlName="Coordenada_Y" >
      </div>
      <div class="col-md-3">
        <label class="form-label">Coordenada X</label>
        <input type="number" class="form-control" formControlName="Coordenada_X">
      </div>
    </div>


  </div>

  <div class="d-flex justify-content-end align-items-center mt-5">
    <app-submit-form
      [form]="oficinaForm"
      [submitFn]="submitFn.bind(this)"
      label="Crear Oficina"
      [requiredFields]="[
      'Nombre',
      'Descripcion',
      'Ubicacion',
      'Coordenada_Y',
      'Coordenada_X',
      ]"
      >
    </app-submit-form>
  </div>
</form>
