<div *ngIf="singleGrupoDeDatoData; else noData" >
    <div class="section-container-title">
        <h3 class="title">{{ isEditing ? 'Editar Grupo de Datos : ' : 'Grupo de Datos: ' }} <span class="text-muted"> {{singleGrupoDeDatoData.Campo}} (Cod {{singleGrupoDeDatoData.ID}}) </span></h3>
        <app-general-plus-check-btn
            tipo="edit-single"
            (editStateChanged)="isEditing = $event">
          </app-general-plus-check-btn>
    </div>


    <form [formGroup]="grupoDatoForm" class="form" enctype="multipart/form-data">
      <div class="section-container">
          <div class="row mb-3">

              <div class="col-md-4 text-start">
                  <label class="form-label">Nombre</label>
                  <input type="text" class="form-control" formControlName="Nombre"  [readonly]="!isEditing" onlyMayus>
              </div>

              <div class="col-md-4 text-start">
                  <label class="form-label">Descripcion</label>
                  <input type="text" class="form-control" formControlName="Descripcion"  [readonly]="!isEditing" onlyMayus>
              </div>


              <div class="col-md-4 text-start">
                  <label class="form-label">Estado</label>
                  <div class="d-flex py-2 gap-2 align-items-center" *ngIf="isEditing; else viewEstado">
                      <app-general-plus-check-btn 
                      tipo="toggle" 
                      [currentValue]="grupoDatoForm.get('Estado')?.value" 
                      [onToggle]="updateEstado">
                      </app-general-plus-check-btn>
                      <input type="hidden" formControlName="Estado">
                      <span>{{ grupoDatoForm.get('Estado')?.value == 1 ? 'Activo' : 'Inactivo' }}</span>
                  </div>

                  <ng-template #viewEstado>
                  <input type="text" class="form-control"
                          [value]="grupoDatoForm.get('Estado')?.value == 1 ? 'Activo' : 'Inactivo'"
                          readonly>
                  </ng-template>

              </div>
          </div>

      </div>
      <div *ngIf="isEditing" class="d-flex justify-content-end mt-5">
          <app-submit-form 
          [form]="grupoDatoForm" 
          [submitFn]="submitFn.bind(this)" 
          label="Actualizar Grupo de Dato"
          [requiredFields]="[
          'Nombre',
          'Descripcion',
          ]"
          >
          </app-submit-form>
      </div>

      <div *ngIf="!isEditing">
        <div class="section-container">
          <h4 class="subtitle">Lista de Datos ingresados</h4>
          <app-general-table
          [columns]="DatosColumns"
          [data]="DatosData"
          (rowClick)="onRowClick($event)"
          >
          </app-general-table>
        </div>
        <div class="d-flex justify-content-end">
          <app-general-plus-check-btn [tipo]="'plus'" [routerLink]="'./nuevo-dato'"></app-general-plus-check-btn>
        </div>
      </div>
      
  </form>
     

</div>


<ng-template #noData>
<p>No se encontraron datos para este Grupo de Datos.</p>
</ng-template>
