<div class="section-container-title">
    <h3 class="title">Completa los Datos del Nuevo Dato del Grupo de Datos</h3>
    <app-general-back-btn
    [tipo]="'cancel'">
  </app-general-back-btn>
</div>

<div class="section-container">
  <div class="row">
    <div class="col-md-6 mb-3">
      <label for="nombre" class="form-label">Nombre</label>
      <input type="text" id="nombre" class="form-control" name="Nombre" [(ngModel)]="formData.Nombre" >
    </div>

    <div class="col-md-6 mb-3">
      <label for="valor" class="form-label">Valor</label>
      <input type="text" id="valor" class="form-control" name="Valor" [(ngModel)]="formData.Valor" >
    </div>
  </div>
  <div class="row">
  <div class="col-md-12 mb-3">
    <label for="descripcion" class="form-label">Descripción</label>
    <input type="text" id="descripcion" class="form-control" name="Descripcion" [(ngModel)]="formData.Descripcion" >
  </div>
  </div>
</div>


<div class="d-flex justify-content-end align-items-center mt-5">
  <app-general-plus-check-btn
    tipo="check-form"
    [submitFn]="submitFn"
    [formData]="formData"
    (onSuccess)="handleSuccess()">
  </app-general-plus-check-btn>
</div>
