<div>
  <div class = "section-container-title">
    <h3 class = "title">Resumen pago <span class="text-muted">(Cod. {{singlePagoRealizadoData.ID}})</span></h3>
    <app-general-back-btn
    [tipo]="'cancel'">
    </app-general-back-btn>
  </div>

  <div class = "px-5">
    <div class = "section-container">
      <h4 class = "subtitle mb-4 d-flex justify-content-center">Detalles del pago</h4>

      <div class="row justify-content-center mb-2">
        <div class="col-md-7 mb-5">
          <label for="credito" class="form-label">Cliente</label>
          <input type="text" id="cliente" class="form-control" value="{{singlePagoRealizadoData.Cliente}}" readonly>
        </div>
      </div>

      <div class="row mb-w justify-content-center"> 
        <div class="col-md-6 mb-2"> 
          <div class="col-md-7 mx-auto mb-5"> 
            <label for="credito" class="form-label">Monto pagado</label>
            <input type="text" class="form-control" value="{{singlePagoRealizadoData.Monto_Cuota | number:'1.2-2'}}" readonly>
          </div>

          <div class="col-md-7 mx-auto mb-5">
            <label for="credito" class="form-label">Fecha de pago</label>
            <input type="text" class="form-control" value="{{singlePagoRealizadoData.Fecha_Pago}}" readonly>
          </div>

          <div class="col-md-7 mx-auto mb-5">
            <label for="credito" class="form-label">Hora de pago</label>
            <input type="text" class="form-control" value="{{singlePagoRealizadoData.Hora_Pago}}" readonly>
          </div>
        </div>

        <div class="col-md-6 mb-2">
          <div class="col-md-7 mx-auto mb-5">
            <label for="credito" class="form-label">Usuario</label>
            <input type="text" class="form-control" value="{{singlePagoRealizadoData.Nombre_Corto}}" readonly>
          </div>

          <div class="col-md-7 mx-auto mb-5">
            <label for="credito" class="form-label">Modalidad de pago</label>
            <input type="text" class="form-control" value="{{singlePagoRealizadoData.Tipo_Pago}}" readonly>
          </div>

          <div class="col-md-7 mx-auto mb-5">
            <label for="credito" class="form-label">Oficina</label>
            <input type="text" class="form-control" value="{{singlePagoRealizadoData.Oficina}}" readonly>
          </div>
        </div>
      </div>
    </div>

    <div class = "section-container">
      <h4 class = "subtitle mb-4 d-flex justify-content-center">Realizar extorno</h4>

      <form [formGroup]="extornoForm" class = "form">
        <div class="row justify-content-center">
          <div class="col-md-5 mb-3">
            <label for="Tipo_Extorno" class="form-label">Motivo para realizar el extorno</label>
            <select id="Tipo_Extorno" class="form-control" formControlName="Tipo_Extorno" required>
              <option value="Cheque errado">Cheque errado</option>
              <option value="Cronograma errado">Cronograma errado</option>
              <option value="Error del sistema">Error del sistema</option>
              <option value="Monto errado">Monto errado</option>
              <option value="Fecha errada">Fecha errada</option>
              <option value="Cancelación errada">Cancelación errada</option>
              <option value="Banco errado">Banco errado</option>
            </select>
          </div>
          <div class="col-md-5 mb-5">
            <label for="Comentario" class="form-label">Comentario</label>
            <textarea type="text" id="Comentario" class="form-control" formControlName="Comentario" rows="1"></textarea>
          </div>
        </div>
      </form>

      <div class="d-flex justify-content-end align-items-center mt-3 mb-2">
        <button mat-raised-button color="primary" (click)="onExtorno()">
          Extornar pago
      </button>
      </div>
    </div>
  </div>

  <!-- Popup de Validación -->
  <div class="popup-overlay" *ngIf="showValidationPopup && !showResultPopup">
    <div class="popup-content">
      <div class="popup-header">
        <h4>Confirmar Extorno</h4>
      </div>
      <p>¿Estás seguro que deseas extornar este pago?</p>
      <div class="popup-actions">
        <button class="btn btn-primary" (click)="onSubmit()" [disabled]="isSubmitting">
          <span *ngIf="!isSubmitting">Sí</span>
          <span *ngIf="isSubmitting">Extornando...</span>
        </button>
        <button class="btn btn-secondary" (click)="cancelValidation()" [disabled]="isSubmitting">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Popup de Resultado -->
  <div class="popup-overlay" *ngIf="showResultPopup">
    <div class="popup-content">
      <p>Pago extornado exitosamente!</p>
      <button class="btn btn-primary" (click)="closePopup()">Cerrar</button>
    </div>
  </div>
</div>
