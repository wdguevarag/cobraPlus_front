<div class="section-container-title">
    <h3 class="title">Proyeccion Desembolso</h3>
</div>

<div class="section-container">
    <div class="row g-3">
        <div class="col-md-4">
            <h4 class="subtitle">Proyectado</h4>
            <div >
                <label class="form-label d-block">Nº: <span class="fw-bold">10</span></label>
                <label class="form-label d-block">Monto: <span class="fw-bold text-success">S/.500.00</span></label>
            </div>
            <div>
                <label class="form-label">Fecha de Inicio</label>
                <input type="date" class="form-control">
            </div>
        </div>

        <div class="col-md-4">
            <h4 class="subtitle">Desembolso</h4>
            <div >
                <label class="form-label d-block">Nº: <span class="fw-bold">10</span></label>
                <label class="form-label d-block">Monto: <span class="fw-bold text-success">S/.500.00</span></label>
            </div>
            <div>
                <label class="form-label">Analista Asignado</label>
                <select class="form-control">
                    <option value="Analista 1">Analista 1</option>
                    <option value="Analista 2">Analista 2</option>
                    <option value="Analista 3">Analista 3</option>
                </select>
            </div>
        </div>

        <div class="col-md-2 d-flex align-items-end justify-content-center">
            <button class="btn btn-success">
                <i class="bi bi-list-ul"></i> 
            </button>
        </div>
    </div>
</div>

<div class="section-container">
    <app-general-table 
    [columns]="proyeccionDesembolsoColumns" 
    [data]="proyeccionDesembolsoData" 
    >
  </app-general-table>
</div>

<div class="d-flex justify-content-end mt-5">
    <app-general-plus-check-btn [tipo]="'plus'" [routerLink]="'./nueva-proyeccion-desembolso'"></app-general-plus-check-btn>
  </div>
