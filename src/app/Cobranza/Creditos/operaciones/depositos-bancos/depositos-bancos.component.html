<div>
  <div class = "section-container-title d-flex justify-content-between align-items-center">
    <h3 class = "title">Depositos a Bancos</h3>
  </div>

  <div class = "section-container">
    <div class = "row mb-3">
      <h4 class = "subtitle">Lista de Depositos a Bancos</h4>
    </div>

    <app-general-table
      [columns] = "DepositosColumns"
      [data] = "DepositosData"
      tableName="depositosBancos"
      (rowClick)="onRowClick($event)"
      [filters]="DepositosFilters"
      (buttonClick)="onButtonClick($event)"
      >
    </app-general-table>
  </div>

  <div class = "d-flex justify-content-end mt-5">
    <app-general-plus-check-btn [tipo] = "'plus'" [routerLink] = "'./nuevo-deposito-banco'"> </app-general-plus-check-btn>
</div>

<div class="popup-container" *ngIf="showConfirmPopup">
  <div class="popup-content">
    <button class="close-btn" (click)="closePopup()"><span>✖</span></button>
    <h4 class="text-primary">Confirmar Acción</h4>
    <p>¿Está seguro que desea <strong>{{ actionType }}</strong> este deposito?</p>
    <button class="btn btn-primary" (click)="confirmAction()">Aceptar</button>
  </div>
</div>
