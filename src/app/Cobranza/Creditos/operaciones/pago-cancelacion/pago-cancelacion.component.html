  <app-general-table
    [columns]="pagosPendientesColumns"
    [data]="pagosPendientes"
    [filters]="pagoFiltersPendientes"
    [enableDateFilter]="true"
    (rowClick)="onRowClick($event)">
  </app-general-table>
</div>
