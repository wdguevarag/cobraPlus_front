<div *ngIf="singleBNData; else noData">

    <div class="section-container-title d-flex justify-content-between align-items-center">
        <h3 class="title"> <span class="text-muted">Base Negativa: (Cod {{singleBNData.ID}}) </span></h3>
    </div> 

        <div class="section-container">
            <div class="row mb-3">
                <div class="col-md-4 text-start">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control" value="{{singleBNData?.Cliente_Nombre}}" onlyMayus readonly>
                </div>

                <div class="col-md-4 text-start">
                    <label class="form-label">Apellido Paterno</label>
                    <input type="text" class="form-control" value="{{singleBNData?.Cliente_Apellido_Paterno}}" onlyMayus readonly>
                </div>
          
                <div class="col-md-4 text-start">
                    <label class="form-label">Apellido Materno</label>
                    <input type="text" class="form-control" value="{{singleBNData?.Cliente_Apellido_Materno}}" onlyMayus readonly>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4 text-start">
                    <label class="form-label">Tipo Documento</label>
                    <input type="text" class="form-control" value="{{singleBNData?.Cliente_Tipo_Doc_Nombre}}" onlyMayus readonly>
                </div>

                <div class="col-md-4 text-start">
                    <label class="form-label">Documento</label>
                    <input type="text" class="form-control" value="{{singleBNData?.Cliente_Documento}}" onlyMayus readonly>
                </div>
          
                <div class="col-md-4 text-start">
                    <label class="form-label">Motivo</label>
                    <input type="text" class="form-control" value="{{singleBNData?.Motivo}}" onlyMayus readonly>
                </div>
            </div>


            
            <div class="row mb-3">
                <div class="col-md-12 text-start">
                    <label class="form-label">Comentario</label>
                    <input type="text" class="form-control" value="{{singleBNData?.Comentario}}" onlyMayus readonly>
                </div>

            </div>

        </div>
</div>



<ng-template #noData>
<p>No se encontraron datos para esta Base Negativa</p>
</ng-template>
