<div *ngIf="singleAsesorData; else noData">
    <div class="section-container-title">
        <h3 class="title">Detalles del Asesor: {{singleAsesorData.Nombres}} (Cod: {{singleAsesorData.ID}})</h3>
        <app-general-plus-check-btn 
        tipo="edit-single" 
        (editStateChanged)="isEditing = $event">
        </app-general-plus-check-btn>
    </div> 

    <form [formGroup]="asesorForm" class="form" enctype="multipart/form-data">
          
        <div class="section-container-img-form row mb-5">
    
            <div class="section-container-img col-md-5">
                <div class="contenedor-images">
                  <div class="contenedor-image">
                    <label class="form-label mb-0 fs-4 fw-regular">Anverso</label>
                    <ng-container *ngIf="isEditing; else viewAnverso">
                      <app-general-upload-input-img
                        type="edit"
                        [currentImage]="page_url + singleAsesorData.Documento_Anverso"
                        [width]="'100%'"
                        (fileSelected)="onFileSelected($event, 'Documento_Anverso')">
                      </app-general-upload-input-img>
                    </ng-container>
                    <ng-template #viewAnverso>
                      <img [src]="page_url + singleAsesorData.Documento_Anverso"
                           class="img-fluid rounded border"
                           alt="Documento Anverso"
                           style="max-height: 300px; object-fit: cover;">
                    </ng-template>
                  </div>
      
                  <div class="contenedor-image">
                      <label class="form-label mb-0 fs-4 fw-regular">Reverso</label>
                      <ng-container *ngIf="isEditing; else viewReverso">
                      <app-general-upload-input-img
                        type="edit"
                        [currentImage]="page_url + singleAsesorData.Documento_Reverso"
                        [width]="'100%'"
                        (fileSelected)="onFileSelected($event, 'Documento_Reverso')">
                      </app-general-upload-input-img>
                    </ng-container>
                    <ng-template #viewReverso>
                      <img [src]="page_url + singleAsesorData.Documento_Reverso"
                           class="img-fluid rounded border"
                           alt="Documento Reverso"
                           style="max-height: 300px; object-fit: cover;">
                    </ng-template>
                  </div>
      
                </div>
              </div>

            <div class="section-container col-md-7">
                <div class="row mb-3 datos-container">
                    <div class="col-md-4 text-start">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" formControlName="Nombre" onlyMayus [readonly]="!isEditing">
                    </div>
                    <div class="col-md-4 text-start">
                        <label for="Apellido_Paterno" class="form-label">Apellido</label>
                        <input type="text" class="form-control" formControlName="Apellido" onlyMayus [readonly]="!isEditing">
                    </div>
                    <div class="col-md-4 text-start">
                        <label for="Documento" class="form-label">Documento</label>
                        <input 
                        type="text" 
                        class="form-control" 
                        formControlName="DNI" 
                        maxlength="8"  
                        [readonly]="!isEditing"    
                        onlyNumbers >
                    </div>

             
                    <div class="col-md-4 text-start">
                        <label class="form-label">Email</label>
                        <input type="text" class="form-control" formControlName="Email"  [readonly]="!isEditing" >
                    </div>

                    <div class="col-md-4 text-start">
                        <label class="form-label">Telefono</label>
                        <input type="text" class="form-control" formControlName="Telefono"   maxlength="9"  [readonly]="!isEditing" onlyNumbers>
                    </div>

                    <div class="col-md-4 text-start">
                        <label class="form-label">Direccion</label>
                        <app-general-input-ubicacion 
                        formControlName="Direccion"
                        [editable]="isEditing"
                        >
                        </app-general-input-ubicacion>
                    </div>
              
                
                    <div class="col-md-4 text-start">
                        <label class="form-label">Estado</label>
                        <div class="d-flex justify-content-start align-items-center gap-2"  *ngIf="isEditing; else viewEstado">
                          <app-general-plus-check-btn 
                            tipo="toggle" 
                            [currentValue]="asesorForm.get('Estado')?.value" 
                            [onToggle]="updateEstado">
                          </app-general-plus-check-btn>
                          <input type="hidden" formControlName="Estado">
                          <span class="form-label mb-0">{{ asesorForm.get('Estado')?.value == 1 ? 'Activo' : 'Inactivo' }}</span>
                        </div>
                        <ng-template #viewEstado>
                          <input type="text"
                                 class="form-control"
                                 [value]="asesorForm.get('Estado')?.value == 1 ? 'Activo' : 'Inactivo'"
                                 readonly>
                        </ng-template>
                    </div>
                </div>
            </div>
        </div>

        <div *ngIf="isEditing" class="d-flex justify-content-end mt-5">
          <app-submit-form 
            [form]="asesorForm" 
            [submitFn]="submitFn.bind(this)" 
            label="Actualizar Asesor"
            [reload]="true"
            [requiredFields]="[
            'Nombre',
            'Apellido',
            'Email',
            'DNI',
            'Telefono',
            'Direccion',
          ]"
            
            >
          </app-submit-form>
        </div>
    
    </form>


    <div *ngIf="!isEditing">
        <app-asesor-tabs
            [singleAsesorId]="singleAsesorId" 
            tipo="edit" >
        </app-asesor-tabs>
    </div>
</div>

<ng-template #noData>
    <p>No se encontraron datos para este Asesor.</p>
</ng-template>
