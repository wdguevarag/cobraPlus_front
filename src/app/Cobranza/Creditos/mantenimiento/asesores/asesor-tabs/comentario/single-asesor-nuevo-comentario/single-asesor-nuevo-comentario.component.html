<div>
    <div class="d-flex justify-content-between align-items-center">
      <h5 class="subtitle mb-4">Nuevo Comentario Asesor </h5>
        <button class="btn btn-secondary" (click)="goBack()">
          ATRAS
        </button>
      </div>
    
      <form [formGroup]="comentarioForm" (ngSubmit)="submitFn(comentarioForm.value)">
         <div class="section-container p-0 mb-0">
          <div class="row mb-3">
            <div class="col-md-12">
              <label class="form-label">Comentario</label>
              <input type="text" class="form-control"  formControlName="Comentario">
            </div>
          </div>
        </div>
        <div class="d-flex justify-content-end align-items-center mt-5">
    
          <app-submit-form 
            [form]="comentarioForm" 
            [submitFn]="submitFn.bind(this)" 
            label="Crear Contacto">
          </app-submit-form>
        </div>

      </form>
  </div>
