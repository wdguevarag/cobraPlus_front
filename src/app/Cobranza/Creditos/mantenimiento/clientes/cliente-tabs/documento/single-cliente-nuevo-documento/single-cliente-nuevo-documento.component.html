<div>
  <div class="d-flex justify-content-between align-items-center">
    <h4 class="subtitle mb-4">Nuevo Contacto Documento: {{singleClienteData?.Nombre}} {{singleClienteData?.Apellido_Paterno}}</h4>
    <button class="btn btn-primary" (click)="goBack()">
      <i class="bi bi-arrow-left"></i>
    </button>
    </div>
  
    <form [formGroup]="documentoForm" (ngSubmit)="submitFn(documentoForm.value)">
      <div class="section-container p-0 mb-0">
          
          <div class="row mb-3">
            <div class="col-md-12">
              <label for="descripcion" class="form-label">Descripción</label>
              <input type="text" class="form-control" id="descripcion" formControlName="Descripcion" onlyMayus>
            </div>
          </div>
    
          <div class="row mb-3 d-flex justify-content-center">
            <div class="col-md-12">
              <label for="rutaDocumento" class="form-label">Documento</label>
              <app-general-upload-input-img 
              type="new" 
              [width]="'400px'"
              [height]="'550px'"
              [aspectRatio]="11/16"  
              (fileSelected)="onFileSelected($event, 'Ruta_Documento')"></app-general-upload-input-img>
            </div>
          </div>
      </div>
  
        <app-submit-form 
          [form]="documentoForm" 
          [submitFn]="submitFn.bind(this)" 
          label="Crear Documento"
          [reload]="true"
          [requiredFields]="[
          'Descripcion',
            ]">
        </app-submit-form>
        
    </form>
  </div>
