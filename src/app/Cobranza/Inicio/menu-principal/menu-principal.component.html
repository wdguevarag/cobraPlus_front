
<div *ngIf="type === 'seguridad-menu'">
  <app-menu-seguridad></app-menu-seguridad>
</div>

<div *ngIf="type === 'credito-menu'" class="section-container-menu row">
  <!-- Listado de módulos -->
  <ng-container *ngIf="!selectedModule">
    <nav class="nav flex-column">
      <div class="row mb-3 justify-content-center">
        <ng-container *ngFor="let aplicacion of aplicaciones">
          <ng-container *ngFor="let modulo of getModulosByAplicacion(aplicacion.ID)">
            <div class="col-md-4 mb-3" style="cursor: pointer">
              <div class="card text-center shadow">
                <div class="card-body" (click)="selectModule(aplicacion.Ruta, modulo)">
                  <i class="{{ modulo.Icono }} display-5" style="color: #00B5AD"></i>
                  <h5 class="card-title mt-3">{{ modulo.Nombre }}</h5>
                  <i class="bi bi-arrow-right" style="color: #00B5AD"></i>
                </div>
              </div>
            </div>
          </ng-container>
        </ng-container>
      </div>
    </nav>
  </ng-container>

  <!-- Listado de accesos del módulo seleccionado -->
  <ng-container *ngIf="selectedModule">
    <div class="d-flex align-items-center mb-4">
      <button class="btn btn-link p-0 me-3" (click)="backToModules()">
        <i class="bi bi-arrow-left" style="font-size: 1.5rem;"></i>
      </button>
      <h4 class="m-0">{{ selectedModule.Nombre }}</h4>
    </div>
    <nav class="nav flex-column">
      <div class="row mb-3 justify-content-center">
        <ng-container *ngFor="let acceso of getAccesosByModulo(selectedModule.ID)">
          <div class="col-md-4 mb-3" style="cursor: pointer">
            <div class="card text-center shadow">
              <div class="card-body" (click)="onItemClick(getRuta(selectedModuleRoute, acceso.Ruta))">
                <i class="{{ acceso.Icono }} display-5" style="color: #00B5AD"></i>
                <h5 class="card-title mt-3">{{ acceso.Nombre }}</h5>
                <i class="bi bi-arrow-right" style="color: #00B5AD"></i>
              </div>
            </div>
          </div>
        </ng-container>
      </div>
    </nav>
  </ng-container>
</div>
