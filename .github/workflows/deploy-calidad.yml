name: Deploy Angular desde calidad

on:
  push:
    branches:
      - calidad

  # Permite ejecutarlo manualmente desde Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilar Angular
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicación
        run: npm run build -- --configuration production --base-href /cobraPlus_front/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir aplicación compilada
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/cobra-plus

  deploy:
    name: Publicar en GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
